[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwh-cookbook"
version = "0.1.0"
description = "Facetwork domain: a low-carb cookbook, desserts first, with a dairy-free version of every recipe, nutrition computed from USDA FoodData Central, and a map of where each kind of dish comes from"
requires-python = ">=3.11"
authors = [{name = "Ralph Lemke"}]
dependencies = ["jinja2>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.entry-points."facetwork.domains"]
cookbook = "cookbook:domain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cookbook = ["ffl/*.ffl", "site/templates/*.html", "data/*.json", "data/recipes/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B905"]
